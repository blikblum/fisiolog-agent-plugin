name: Validate plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run validate
      - run: npm run mcp:check
      - run: npm test

  client-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [claude, codex, antigravity]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: matrix.client != 'antigravity'
        with:
          node-version: "24"
      - name: Validate with Claude Code
        if: matrix.client == 'claude'
        run: npm exec --yes --package=@anthropic-ai/claude-code@2.1.330 -- claude plugin validate .
      - name: Install from the local marketplace with Codex
        if: matrix.client == 'codex'
        run: |
          marketplace=$(node -p 'require("./.claude-plugin/marketplace.json").name')
          plugin=$(node -p 'require("./plugin.json").name')
          npm exec --yes --package=@openai/codex@0.162.1 -- codex plugin marketplace add "$GITHUB_WORKSPACE"
          npm exec --yes --package=@openai/codex@0.162.1 -- codex plugin add "$plugin@$marketplace" --json
      - name: Validate with Antigravity CLI
        if: matrix.client == 'antigravity'
        run: |
          curl -fsSL --retry 2 https://antigravity.google/cli/install.sh -o "$RUNNER_TEMP/install-agy.sh"
          bash "$RUNNER_TEMP/install-agy.sh"
          "$HOME/.local/bin/agy" plugin validate .
